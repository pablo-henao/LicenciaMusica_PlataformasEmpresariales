spring.application.name=license

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/license_music}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway es el dueno del esquema (ver src/main/resources/db/migration); Hibernate solo
# valida que las entidades coincidan con lo que Flyway ya creo, nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:LicenciaMasClaveSecreta2026SuperSeguraParaJWT}
jwt.expiration=${JWT_EXPIRATION:86400000}